services:
  mongodb:
    image: mongo:7.0
    container_name: medswin-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password123}
      MONGO_INITDB_DATABASE: medswin
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username $${MONGO_INITDB_ROOT_USERNAME} --password $${MONGO_INITDB_ROOT_PASSWORD} --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - medswin-network

  rag_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medswin-api
    restart: unless-stopped
    ports:
      - "8100:8100"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8100
      MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-password123}@mongodb:27017/medswin?authSource=admin
      MONGODB_DB: medswin
      MONGODB_DATABASE: medswin
      CLOUD_MODE: ${CLOUD_MODE:-true}
      FOUNDRY_MODEL: ${FOUNDRY_MODEL:-gpt-5.4}
      CLOUD_MODEL: ${FOUNDRY_MODEL:-gpt-5.4}
      CLOUD_EMBEDDING: ${CLOUD_EMBEDDING:-embed-v-4-0}
      CLOUD_RERANKER: ${CLOUD_RERANKER:-Cohere-rerank-v4.0-fast}
      AZURE_AI_FOUNDRY_ENDPOINT: ${AZURE_AI_FOUNDRY_ENDPOINT:-}
      AZURE_AI_FOUNDRY_API_KEY: ${AZURE_AI_FOUNDRY_API_KEY:-}
      CLOUD_EMBEDDING_URI: ${CLOUD_EMBEDDING_URI:-}
      CLOUD_RERANKER_URI: ${CLOUD_RERANKER_URI:-}
      EMBEDDING_MODEL_PATH: /app/models/MedEmbed-large-v0.1
      RERANKER_MODEL_PATH: /app/models/bge-reranker-v2-m3
      MEDSWIN_MODEL_PATH: /app/models/MedSwin-DaRE-TIES-KD-0.7
      HNSW_INDEX_PATH: /app/data/hnsw_index.bin
      HNSW_MAPPING_PATH: /app/data/hnsw_mapping.json
      FAISS_INDEX_PATH: /app/data/faiss_index.bin
      FAISS_MAPPING_PATH: /app/data/faiss_mapping.json
      TREE_INDEX_PATH: /app/data/tree_index.npy
      TREE_MAPPING_PATH: /app/data/tree_mapping.json
      DATA_DIR: /app/data
      LOG_FILE: /app/logs/app.log
      DEBUG: "false"
      LOG_LEVEL: INFO
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./logs:/app/logs
      - ./storage:/app/storage
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8100/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - medswin-network

  nginx:
    image: nginx:alpine
    container_name: medswin-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      rag_api:
        condition: service_healthy
    networks:
      - medswin-network

volumes:
  mongodb_data:
    driver: local

networks:
  medswin-network:
    driver: bridge