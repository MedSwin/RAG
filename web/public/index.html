<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MedSwin Clinician CDS</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink:#14201c; --sea:#1f6a5a; --sea-deep:#12483d; --line:rgba(20,32,28,.12);
      --ok:#1f6a5a; --warn:#9a6b12; --bad:#9b2c2c;
      font-family:"DM Sans",system-ui,sans-serif; color:var(--ink);
      background:radial-gradient(circle at 12% 18%,rgba(31,106,90,.14),transparent 34%),linear-gradient(180deg,#f7f4ec,#ebe6da);
    }
    *{box-sizing:border-box} body{margin:0}
    .shell{max-width:1280px;margin:0 auto;padding:28px 20px 48px;display:grid;gap:22px}
    h1{font-family:Fraunces,Georgia,serif;font-size:clamp(2.4rem,5vw,3.6rem);color:var(--sea-deep);margin:0}
    .brand p{max-width:52ch;color:rgba(20,32,28,.72);line-height:1.5}
    .workspace{display:grid;grid-template-columns:minmax(280px,.95fr) minmax(320px,1.2fr);gap:18px}
    @media(max-width:960px){.workspace{grid-template-columns:1fr}}
    .panel{background:rgba(255,252,246,.88);border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 50px rgba(18,40,32,.08);padding:18px}
    h2{margin:0 0 12px;font-size:.95rem;letter-spacing:.04em;text-transform:uppercase;color:var(--sea-deep)}
    label{display:block;margin-top:12px;font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:rgba(20,32,28,.62)}
    input,textarea{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fffdf8;font:inherit}
    textarea{min-height:120px}
    button{margin-top:16px;border:0;border-radius:999px;padding:12px 18px;background:var(--sea);color:#f7fff9;font-weight:700;cursor:pointer}
    button:disabled{opacity:.55}
    .chip{display:inline-flex;border-radius:999px;padding:6px 10px;font-size:.78rem;font-weight:700}
    .accept{background:rgba(31,106,90,.12);color:var(--ok)}
    .retrieve_more,.insufficient_evidence{background:rgba(155,44,44,.12);color:var(--bad)}
    .answer{white-space:pre-wrap;line-height:1.55}
    .row{border:1px solid var(--line);border-radius:14px;padding:12px;background:rgba(255,255,255,.55);margin-top:10px}
    .meta{color:rgba(20,32,28,.62);font-size:.86rem}
    pre{overflow:auto;max-height:280px;background:#13241f;color:#d7f3ea;border-radius:12px;padding:12px;font-size:12px}
    .error{color:var(--bad);font-weight:600;margin-top:12px}
  </style>
</head>
<body>
  <div class="shell">
    <header class="brand">
      <h1>MedSwin</h1>
      <p>Evidence-gated clinician decision support — retrieve enough, know when evidence is insufficient, and expose a reviewable audit trace.</p>
    </header>
    <div class="workspace">
      <form class="panel" id="form">
        <h2>Clinical query</h2>
        <label>Question</label>
        <textarea id="query" required placeholder="Can this patient continue metformin after the latest renal-function result?"></textarea>
        <label>Patient ID</label>
        <input id="patient" placeholder="optional EMR scope" />
        <label>Organization</label>
        <input id="org" value="demo-org" />
        <label>User</label>
        <input id="user" value="clinician-1" />
        <button id="btn" type="submit">Ask MedSwin</button>
        <div class="error" id="error"></div>
      </form>
      <section class="panel">
        <h2>Decision support</h2>
        <div id="out"><p class="meta">Submit a clinical question to see answer, facets, evidence, contradictions, and sufficiency.</p></div>
      </section>
    </div>
  </div>
  <script>
    const form = document.getElementById('form');
    const out = document.getElementById('out');
    const err = document.getElementById('error');
    const btn = document.getElementById('btn');
    form.onsubmit = async (e) => {
      e.preventDefault();
      err.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Running MedSwin…';
      try {
        const payload = {
          query: document.getElementById('query').value,
          patient_id: document.getElementById('patient').value || undefined,
          org_id: document.getElementById('org').value,
          user_id: document.getElementById('user').value,
        };
        const res = await fetch('/api/v1/medswin/chat', {
          method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();
        let trace = null;
        try {
          const tr = await fetch(`/api/v1/medswin/traces/${data.trace_id}?org_id=${encodeURIComponent(payload.org_id)}&include_details=true`);
          if (tr.ok) trace = await tr.json();
        } catch (_) {}
        const action = (data.policy_decision || data.sufficiency_decision || {}).action || 'pending';
        const facets = data.facet_coverage || [];
        const passages = (data.evidence_bundle || {}).passages || [];
        const contradictions = data.contradictions || [];
        out.innerHTML = `
          <div class="chip ${action}">${String(action).replaceAll('_',' ')}</div>
          <p class="meta">Trace ${data.trace_id} · ${(data.citations||[]).length} citations</p>
          <p class="answer">${escapeHtml(data.answer || '')}</p>
          <h2 style="margin-top:22px">Facet coverage</h2>
          ${facets.map(r => `<div class="row"><strong>${escapeHtml(r.facet)} · ${escapeHtml(r.status)}</strong><div class="meta">LCB ${(r.lower_confidence_bound||0).toFixed(2)}</div></div>`).join('') || '<p class="meta">None</p>'}
          <h2 style="margin-top:22px">Citations</h2>
          ${(data.citations||[]).map(c => `<div class="row"><strong>${escapeHtml(c.source_type||'')} · ${escapeHtml(c.chunk_id||'')}</strong><div class="meta">doc ${escapeHtml(c.doc_id||'')}</div></div>`).join('') || '<p class="meta">None</p>'}
          <h2 style="margin-top:22px">Evidence bundle</h2>
          ${passages.map(p => `<div class="row"><strong>${escapeHtml(p.source_type)} · ${escapeHtml(p.chunk_id)}</strong><div class="meta">p̂ ${(p.calibrated_score||0).toFixed(2)}</div><p>${escapeHtml((p.text||'').slice(0,320))}</p></div>`).join('') || '<p class="meta">None</p>'}
          <h2 style="margin-top:22px">Contradiction ledger</h2>
          ${contradictions.map(c => `<div class="row"><strong>${escapeHtml(c.facet)} · ${escapeHtml(c.severity)}</strong><p>${escapeHtml(c.reason||'')}</p></div>`).join('') || '<p class="meta">No contradictions</p>'}
          <h2 style="margin-top:22px">Audit trace</h2>
          <pre>${escapeHtml(JSON.stringify(trace || data, null, 2))}</pre>
        `;
      } catch (ex) {
        err.textContent = ex.message || String(ex);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Ask MedSwin';
      }
    };
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
  </script>
</body>
</html>
