name: Full evaluation contract checks

on:
  pull_request:
    paths:
      - "app/**"
      - "benchmarks/**"
      - "scripts/**"
      - "tests/**"
      - "web/**"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "nginx/**"
      - "requirements.txt"
      - "pytest.ini"
      - "env.example"
      - "docs/**"
      - "README.md"
      - "metrics.md"
      - ".github/workflows/full-eval-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q app benchmarks scripts tests
      - name: Validate startup shell
        run: bash -n scripts/start-local.sh
      - name: Assert paper-eval entrypoints
        run: |
          test -f scripts/warmup-eval.py
          test -f scripts/serve-medswin-llm.py
          test -f benchmarks/trec_cds2016/PREREG.md
          test -f benchmarks/trec_cds2016/contract.py
          test -f benchmarks/trec_cds2016/nist.py
          test -f benchmarks/trec_cds2016/validate.py
          test -f benchmarks/trec_cds2016/exporter.py
          test -f benchmarks/trec_cds2016/emit.py
          test -f benchmarks/trec_cds2016/score.py
          test -f benchmarks/expert/PROTOCOL.md
          test -f benchmarks/trec_cds2016/prepare/mongo.py
          test -f benchmarks/trec_cds2016/prepare/runtime.py
          test -f benchmarks/trec_cds2016/prepare/materialize.py
          test -f benchmarks/trec_cds2016/prepare/verify.py
          test -f docs/PAPER_EVAL.md
          ! test -f eval/scripts/run_full_matrix.py
          ! test -d eval
          ! grep -q 'eval/README.md' README.md docs/README.md docs/ADMIN.md docs/OPERATOR.md docs/NAIVE_RAG.md docs/ENDPOINTS.md
          grep -q 'paper-eval' scripts/start-local.sh
          grep -q -- '--stage' scripts/start-local.sh
          grep -q -- '--systems' scripts/start-local.sh
          grep -q -- '--pipeline' scripts/start-local.sh
          grep -q -- '--generator' scripts/start-local.sh
          grep -q -- '--topic-field' scripts/start-local.sh
          grep -q 'medswin-mongodb' scripts/start-local.sh
          grep -q 'mongo:7.0' scripts/start-local.sh
          ! grep -q 'rag_mongodb' scripts/start-local.sh
          ! grep -q 'EVAL_PORT' scripts/start-local.sh
          grep -q 'EVAL_WARMUP_ON_START:-false' scripts/start-local.sh
          grep -q 'EXPECTED_DOCUMENTS = 1_255_260' benchmarks/trec_cds2016/contract.py
          grep -q 'EXPECTED_QRELS = 37_707' benchmarks/trec_cds2016/contract.py
          grep -q 'RRF_K = 60' benchmarks/trec_cds2016/contract.py
          grep -q 'CASCADE_RERANK = 300' benchmarks/trec_cds2016/contract.py
          grep -q 'input_type="document"' benchmarks/trec_cds2016/prepare/runtime.py
          grep -q 'CLOUD_EMBEDDING_DEFAULT_INPUT_TYPE' scripts/start-local.sh
          grep -q 'prepare.mongo' scripts/start-local.sh
          grep -q 'prepare.materialize' scripts/start-local.sh
          grep -q 'prepare.verify' scripts/start-local.sh
      - name: Assert official NIST pins and validator
        run: |
          grep -q 'https://trec.nist.gov/data/clinical/topics2016.xml' benchmarks/trec_cds2016/nist.py
          grep -q 'https://trec.nist.gov/data/clinical/qrels-treceval-2016.txt' benchmarks/trec_cds2016/nist.py
          grep -q 'https://trec.nist.gov/data/clinical/qrels-sampleval-2016.txt' benchmarks/trec_cds2016/nist.py
          grep -q 'https://trec.nist.gov/data/clinical/sample_eval.pl' benchmarks/trec_cds2016/nist.py
          grep -q '167541d16ab0986fd36045fb4e1104fccb6c8df18e1842b7ee448e7639479767' benchmarks/trec_cds2016/PREREG.md
          grep -q 'qid 1-30' benchmarks/trec_cds2016/PREREG.md
          grep -q 'not in 1-30' benchmarks/trec_cds2016/validate.py
          grep -q 'bare integer' benchmarks/trec_cds2016/PREREG.md
          grep -q 'PREGISTERED_CONTRASTS' benchmarks/trec_cds2016/stats.py
          grep -q 'LIT_ONLY' benchmarks/trec_cds2016/exporter.py
          grep -q 't3_query' benchmarks/trec_cds2016/topics.py
          grep -q 'path.is_dir()' benchmarks/trec_cds2016/nist.py
          ! grep -qi 'msas' benchmarks/trec_cds2016/*.py
      - name: Assert resilience and reproducibility contracts
        run: |
          grep -q 'PREPARATION_CONTRACT_VERSION' benchmarks/trec_cds2016/contract.py
          grep -q 'chunker_sha256' benchmarks/trec_cds2016/contract.py
          grep -q 'terminal_repaired' benchmarks/trec_cds2016/prepare/mongo.py
          grep -q 'prefix_documents' benchmarks/trec_cds2016/prepare/mongo.py
          grep -q 'HNSW_MAX_EF_SEARCH' app/core/indexing/hnsw.py
          grep -q 'max_ef = max' app/core/indexing/hnsw.py
          grep -q '_strict_benchmark_runtime' app/main.py
          grep -q 'await db.command("ping")' app/main.py
          grep -q 'await close_database()' app/main.py
          grep -q 'hnsw_vector_alignment' benchmarks/trec_cds2016/prepare/verify.py
          grep -q 'FULL_VERIFY_HNSW_SAMPLES' benchmarks/trec_cds2016/prepare/verify.py
          grep -q 'chunk_id_fingerprint' benchmarks/trec_cds2016/prepare/verify.py
          grep -q 'input_type="document" if settings.CLOUD_MODE else None' app/api/v1/endpoints/medswin.py
          grep -q '_render_final_answer' app/medswin/orchestrator.py
          grep -q '_generation_signature' app/indexes/hybrid.py
          grep -q 'disable_gate' app/medswin/orchestrator.py
          grep -q 'disable_mac' app/medswin/orchestrator.py
      - name: Assert reproducible generator contract
        run: |
          grep -q 'HfApi' scripts/warmup-eval.py
          grep -q 'revision=revision' scripts/warmup-eval.py
          grep -q 'model_revision' scripts/serve-medswin-llm.py
          grep -q 'fail_on_overflow_no_truncation' scripts/serve-medswin-llm.py
          grep -q 'LLM_DEFAULT_MAX_TOKENS' app/services/adapters/llm.py
          grep -q 'AGENT_PASSAGE_LIMIT' app/agents/base.py
          grep -q 'generation_backend' app/main.py
          grep -q 'generation_model' app/main.py
          grep -q 'warm_nist' scripts/warmup-eval.py
          grep -q 'ensure_trec_eval' scripts/warmup-eval.py
      - name: Assert benchmark isolation
        run: |
          grep -q '^CLOUD_EMBEDDING_DEFAULT_INPUT_TYPE=$' env.example
          grep -q 'FULL_EVAL_DATA_DIR' env.example
          grep -q 'TREC_EVAL_BIN' env.example
          grep -q 'NIST_DIR' env.example
          grep -q 'full-trec-benchmark' scripts/start-local.sh
          grep -q 'FULL_EVAL_LLM_TIMEOUT_S' scripts/start-local.sh
          grep -q 'HNSW_MAPPING_PATH=.*hnsw_mapping.sqlite' scripts/start-local.sh
          grep -q 'FAISS_INDEX_PATH=.*faiss_unused.bin' scripts/start-local.sh
          grep -q 'FAISS_MAPPING_PATH=.*faiss_unused.json' scripts/start-local.sh
          grep -q 'CLOUD_EMBEDDING_DEFAULT_INPUT_TYPE' scripts/start-local.sh
          ! grep -q 'BENCHMARK_CORPUS_SAMPLE_SIZE' env.example
          ! grep -q 'EVAL_BASE_URL' env.example
      - name: Assert provider-safe configuration
        run: |
          grep -q 'CLOUD_EMBEDDING_URI: Optional\[str\] = None' app/core/config.py
          grep -q 'CLOUD_RERANKER_URI: Optional\[str\] = None' app/core/config.py
          grep -q 'providers/cohere/v2/rerank' app/core/config.py
          grep -q 'search_document' app/services/adapters/embedding.py
          grep -q 'search_query' app/services/adapters/embedding.py
          grep -q 'cohere_native' app/services/adapters/embedding.py
          grep -q 'CLOUD_RERANKER_AUTH_SCHEME' app/services/adapters/reranker.py
          grep -q 'Authorization.*Bearer' app/services/adapters/reranker.py
          ! grep -q 'parth-pandya' app/core/config.py

  contract-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pytest==8.3.4 \
            pytest-asyncio==0.24.0 \
            pydantic==2.11.9 \
            pydantic-settings==2.0.3 \
            httpx==0.28.1 \
            pymongo==4.10.1 \
            motor==3.7.1 \
            numpy==2.1.3 \
            hnswlib==0.8.0 \
            ir-datasets==0.5.9
      - name: Run strict contract unit tests
        run: |
          pytest -q tests/test_full_eval_contract.py tests/test_trec_cds2016.py tests/test_hnsw_adaptive.py

  full-python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Verify installed API route graph
        run: |
          python - <<'PY'
          from app.main import app
          paths = {route.path for route in app.routes}
          required = {
              "/health",
              "/api/v1/medswin/chat",
              "/api/v1/naive/chat",
              "/api/v1/storage/chunks",
              "/api/v1/retrieval/search",
              "/api/v1/embedding/embed",
              "/api/v1/preprocessing/chunk",
          }
          missing = sorted(required - paths)
          if missing:
              raise SystemExit(f"missing required routes: {missing}")
          print(f"route graph OK: {len(paths)} routes")
          PY
      - name: Run complete Python test suite
        run: pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build clinician UI
        run: npm run build

  container-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Compose graph
        run: |
          docker compose config > /tmp/medswin-compose.yml
          grep -q 'target: 8100' /tmp/medswin-compose.yml
          grep -Eq 'published: "?8100"?' /tmp/medswin-compose.yml
          grep -q 'container_name: medswin-api' /tmp/medswin-compose.yml
          grep -q 'container_name: medswin-mongodb' /tmp/medswin-compose.yml
          ! grep -q 'medical_rag_db' /tmp/medswin-compose.yml
      - name: Build supported container image
        run: docker build --progress=plain -t medswin-ci .
      - name: Check container dependency consistency
        run: docker run --rm --entrypoint python medswin-ci -m pip check
      - name: Import API from built image
        run: >-
          docker run --rm --entrypoint python medswin-ci -c
          'from app.main import app; paths={route.path for route in app.routes};
          required={"/health","/api/v1/medswin/chat","/api/v1/storage/chunks"};
          missing=sorted(required-paths);
          (_ for _ in ()).throw(SystemExit(f"container missing required routes: {missing}")) if missing else None;
          print(f"container API import OK: {len(paths)} routes")'
